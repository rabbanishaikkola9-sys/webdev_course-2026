<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pure HTML Media Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Harry bhai ke Course ka first assignment</h1>
    <main class="maincontent">
      <div class="audio">
        <h2>Audio files</h2>
        <div class="file1">
          <p>Audio File 1</p>
          <audio src="1.mp3" controls></audio>
        </div>
        <div class="audio2">
          <p>Audio File 2</p>
          <audio src="2.mp3" controls></audio>
        </div>
        <div class="audio3">
          <p>Audio File 3</p>
          <audio src="3.mp3" controls></audio>
        </div>
        <div class="audio4">
          <p>Audio File 4</p>
          <audio src="4.mp3" controls></audio>
        </div>
        <div class="audio5">
          <p>Audio File 5</p>
          <audio src="5.mp3" controls></audio>
        </div>
        <div class="audio6">
          <p>Audio File 6</p>
          <audio src="6.mp3" controls></audio>
        </div>
      </div>
      <div class="video">
        <h2>Video files</h2>
        <div class="video1">
          <p>Video file 1</p>
          <video src="1.mp4" controls></video>
        </div>
        <div class="video1">
          <p>Video file 2</p>
          <video src="2.mp4" controls></video>
        </div>
        <div class="video3">
          <p>Video file 3</p>
          <video src="3.mp4" controls></video>
        </div>
        <div class="video4">
          <p>Video file 4</p>
          <video src="4.mp4" controls></video>
        </div>
        <div class="video5">
          <p>Video file 5</p>
          <video src="5.mp4" controls></video>
        </div>
        <div class="video6">
          <p>Video file 6</p>
          <video src="6.mp4" controls></video>
        </div>
      </div>
    </main>
  </body>
</html>
