<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media player | HTML</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    body{
        background-color: aliceblue;
    }
    h1{
        background-color: rgb(181, 181, 221);
        color: black;
    }
</style>
<body>
     <h1 style="text-align: center;">Videos</h1>
    <span>
        <video src="1.mp4" controls loop muted height="555" width="555"></video>
    </span>
    <span>
        <video src="2.mp4" controls loop muted height="555"></video>
    </span>
    <span>
        <video src="3.mp4" controls loop muted height="555" width="455"></video>
    </span>
    <span>
        <video src="4.mp4" controls loop muted height="555" width="455"></video>
    </span>
    <span>
        <video src="5.mp4" controls loop muted height="555" width="455"></video>
    </span>
    <span>
        <video src="6.mp4" controls loop muted height="555" width="455"></video>
    </span>
     <h1 style="text-align: center;">Audios</h1>
    <span>
        <video src="1.mp3" controls loop muted"></video>
    </span>
    <span>
        <video src="2.mp3" controls loop muted"></video>
    </span>
    <span>
        <video src="3.mp3" controls loop muted"></video>
    </span>
    <span>
        <video src="4.mp3" controls loop muted"></video>
    </span>
    <span>
        <video src="5.mp3" controls loop muted"></video>

    <span>
        <video src="6.mp3" controls loop muted"></video>
    </span>
</body>
</html>
