<!DOCTYPE html>
<html>
<head>
    <title>Preload Example</title>
</head>

<body>

    <h2>None</h2>
    <audio src="sachin.mp3" controls preload="none"></audio>

    <h2>Metadata</h2>
    <audio src="sachin.mp3" controls preload="metadata"></audio>

    <h2>Auto</h2>
    <audio src="sachin.mp3" controls preload="auto"></audio>

</body>
</html>
