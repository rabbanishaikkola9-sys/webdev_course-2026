<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio-Video-Media |HTML</title>
</head>

<body>
    <video src="video.mp4" controls height="500" width="500" muted poster="train.jpg"></video>
    <audio src="sachin.mp3" controls muted autoplay "></audio>
    <svg height=" 100" width="100">
        <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
        </svg>
        <!-- Using iframes -->
        <div>

            <iframe src="https://www.codewithharry.com/" height="500" width="500" frameborder="0"></iframe>
        </div>
        <div>
            <iframe width="560" height="315"
                src="https://www.youtube-nocookie.com/embed/XZwBNDGuWGU?si=dLGuAjfZpYunlWcm"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
</body>

</html>
