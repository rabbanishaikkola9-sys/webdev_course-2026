<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Quiz | HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <!-- Quick Quiz:
    Without using br tag, write a vertically aligned form asking for name, city and pincode of a user.
    Everyone must comment -->
    <h1>Form for the quick quiz</h1>
    <form action="post">
        <div>
            <label for="uname">Enter your username:</label>
            <input type="text" name="username" placeholder="Enter your username" id="uname">
        </div>
        <div>
            <label for="city">Enter your City name:</label>
            <input type="text" name="city" placeholder="Enter your city name" id="city">
        </div>
        <div>
            <label for="no">Enter the pincode:  </label>
            <input type="text" placeholder="Enter pincode" name="number" id="no">
        </div>
    </form>
</body>
</html>
