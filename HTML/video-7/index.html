<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms- HTML </title>
</head>

<body>
    <h1>Form to apply the UPSC examination</h1>
    <form action="post">
        <div>

            <label for="username">Enter your name</label>
            <input type="text" id="username" name="username" placeholder="Enter your name " autofocus>
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">Subscribe to newsletter</label>  
        </div>
        <div>
            <label for="comment">Enter your comment:- </label> <br>
            <textarea name="comment" rows="4" cols="50" id="comment"></textarea>
        </div>
        <div>
            <label for="email">Enter your email</label>
            <input type="email" placeholder="Enter your email" id="email">
        </div>
        <div>
            <h2>Select your fav fruit:</h2>
            <select name="Fruits" id="fruits">
                <option value="Mango">Mango</option>
                <option value="Apple">Apple</option>
                <option value="Banana">Banana</option>
            </select>
        </div>
    </form>
</body>

</html>
