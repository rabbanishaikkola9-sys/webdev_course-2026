<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Display | CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid black;
            display: inline-block;
            background-color: red;
            color: white;
            margin: 34px;
            padding: 45px;
        }

        .span {
            border: 2px solid black;
            display: inline-block;
            /* height: 200px; */
            /* width: 200px; */
            background-color: red;
            color: white;
            margin: 34px;
            padding: 45px;
        }
        .box1{
            /* display: none; */
            /* visibility: hidden; */
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="box box1">
        Hey I am box</div>
    <div class="box">
        Am another box</div>
    <span class="span">
        Hey I am span
    </span>
    <span class="span">
        I am also span
    </span>
</body>

</html>
