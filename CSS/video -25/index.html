<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Lists | CSS</title>
    <style>
        nav ul li{
            /* border: 2px solid red; */
            /* list-style: devanagari; */
            background-color: rgb(216, 216, 197);
            list-style-position: inside;
            /* list-style-image: url("warning-sign.png"); */
            /* list-style: "🐒"; */
            list-style-type:  disc inside "🐒";
            display: flex;
            padding: 7px;
        }
        .home{
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <nav>
        <ul class="home">
            <li>Home</li>
            <li>About</li>
            <li>Contacts</li>
        </ul>
    </nav>
</body>
</html>
