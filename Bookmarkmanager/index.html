<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark manager-HTML</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1 style="background-color: rgb(231, 179, 8);">Primary bookmarks</h1>

    <a target="_blank" href="https://www.amazon .com">Open amazon </a><br>
    <h2 style="background-color: rgb(231, 179, 8);"">Secondary bookmarks </h2>
    <a target="_blank" href="https://www.github.com">Open github</a><br>
    <a target="_blank" href="https://www.brave.com">Open Brave </a><br>
    <a target="_blank" href="https://www.flipkart.com">Open flipkart </a> <br>
</body>
</html>
